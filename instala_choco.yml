---
# ============================
# PLAY 1 — CONTROLLER (Windows)
# ============================
- name: Preparar repositório/manifesto e compartilhar com usuário+senha
  hosts: controller_win
  gather_facts: no
  collections:
    - ansible.windows

  vars:
    # Caminhos no controller
    repo_root:   'C:\ChocoRepo'
    repo_export: 'C:\ChocoRepo\export'
    repo_nupkg:  'C:\ChocoRepo\nupkg'
    share_name:  'ChocoRepo'

    # Credenciais do compartilhamento (usuario LOCAL do controller)
    smb_user: 'repo_user'
    smb_pass: 'TroqueEstaSenha!2025'

  tasks:
    # --- 1) Ler e transformar packages.txt (no host que executa o playbook) ---
    - name: Ler packages.txt
      vars:
        ansible_connection: local
        ansible_shell_type: sh
      delegate_to: local
      run_once: true
      ansible.builtin.slurp:
        src: "files/packages.txt"
      register: pkgs_file

    - name: Normalizar conteúdo
      set_fact:
        _pkgs_text: >-
          {{ pkgs_file.content | b64decode
             | regex_replace('^\uFEFF','')
             | regex_replace('^\u00EF\u00BB\u00BF','')
             | regex_replace('^"|"$','')
             | regex_replace('\\\\r','')
             | regex_replace('\\\\n','\n') }}

    - name: Linhas úteis
      set_fact:
        _lines: >-
          {{ _pkgs_text.splitlines()
             | map('trim')
             | reject('equalto','')
             | reject('match','^#')
             | list }}

    - name: Inicializar listas
      set_fact:
        pkgs_ready: []
        pkgs_manifest: []

    - name: Montar estrutura p/ win_chocolatey (name/version/pkg_args)
      set_fact:
        pkgs_ready: >-
          {{ pkgs_ready + [ {
              'name_only': name_ver[0],
              'version':   ((name_ver | length) > 1) | ternary(name_ver[1], ''),
              'pkg_args':  line_args
            } ] }}
      vars:
        first_token: "{{ (item.split(' ', 1))[0] }}"
        name_ver:    "{{ first_token.split('=', 1) }}"
        line_args:   "{{ ((item.split(' ', 1) | length) > 1) | ternary((item.split(' ',1))[1], '') }}"
      loop: "{{ _lines }}"
      loop_control:
        label: "{{ item }}"

    - name: Construir manifesto (name/kind/args [+ versão opcional])
      set_fact:
        pkgs_manifest: |
            {{ pkgs_manifest + [ {
              'name': item.name_only,
              'version': (item.version | trim | length > 0) | ternary(item.version, omit),
              'kind': (item.pkg_args is search('--install-arguments')) | ternary('passthrough','params'),
              'args': item.pkg_args | default('')
            } ] }}
      loop: "{{ pkgs_ready }}"
      loop_control:
        label: "{{ item.name_only }}"

    # --- 2) Preparar repositório no controller ---
    - name: Garantir diretórios do repositório
      win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ repo_root }}"
        - "{{ repo_export }}"
        - "{{ repo_nupkg }}"

    - name: Salvar packages_with_params.json (manifesto)
      win_copy:
        dest: "{{ repo_export }}\\packages_with_params.json"
        content: "{{ pkgs_manifest | to_nice_json }}"

    - name: Localizar todos os .nupkg instalados no controller
      win_find:
        paths: 'C:\ProgramData\chocolatey\lib'
        patterns: '*.nupkg'
        recurse: yes
      register: found_nupkg

    - name: Copiar .nupkg para {{ repo_nupkg }}
      win_copy:
        src: "{{ item.path }}"
        dest: "{{ repo_nupkg }}\\"
        remote_src: true
        force: true
      loop: "{{ found_nupkg.files }}"
      loop_control:
        label: "{{ item.path }}"

    # --- 3) Usuário local e compartilhamento restrito a ele ---
    - name: Criar/atualizar usuário local do share (senha forte)
      win_powershell:
        script: |
          $ErrorActionPreference='Stop'
          $User='{{ smb_user }}'; $Plain='{{ smb_pass }}'
          if ([string]::IsNullOrWhiteSpace($Plain)) { throw 'Defina smb_pass com uma senha forte.' }
          $sec = ConvertTo-SecureString $Plain -AsPlainText -Force
          $local = Get-LocalUser -Name $User -ErrorAction SilentlyContinue
          if ($null -eq $local) {
            New-LocalUser -Name $User -Password $sec -PasswordNeverExpires:$true -UserMayNotChangePassword:$true | Out-Null
          } else {
            $local | Set-LocalUser -Password $sec -PasswordNeverExpires:$true | Out-Null
          }
          # Adiciona ao grupo "Users" (resolve nome localizado pelo SID do grupo Users)
          $UsersGroup = (New-Object System.Security.Principal.SecurityIdentifier 'S-1-5-32-545').Translate([System.Security.Principal.NTAccount]).Value
          try { Add-LocalGroupMember -Group $UsersGroup -Member $User -ErrorAction SilentlyContinue } catch {}

    - name: Recriar share apenas com o usuário (remove ACEs antigas)
      win_powershell:
        script: |
          $ErrorActionPreference='Stop'; $ConfirmPreference='None'
          $Name='{{ share_name }}'; $Path='{{ repo_root }}'
          $UserFqdn="$env:COMPUTERNAME\{{ smb_user }}"
          New-Item -Path $Path -ItemType Directory -Force | Out-Null
          # Remove se existir
          try { Remove-SmbShare -Name $Name -Force -Confirm:$false } catch {}
          # Cria share "limpo"
          New-SmbShare -Name $Name -Path $Path -CachingMode None -Confirm:$false | Out-Null
          # Concede Full no SHARE ao usuário
          Grant-SmbShareAccess -Name $Name -AccountName $UserFqdn -AccessRight Full -Force -Confirm:$false | Out-Null

    # SUBSTITUA a task que falhou por esta:
    - name: NTFS – conceder Modificar ao usuário e remover Everyone (via CMD)
      win_shell: |
        icacls "{{ repo_root }}" /grant "%COMPUTERNAME%\{{ smb_user }}":(OI)(CI)M /T /Q
        icacls "{{ repo_root }}" /remove *S-1-1-0 /T /Q
      args:
        executable: cmd


    - name: Liberar SMB no firewall (TCP/445)
      win_firewall_rule:
        name: "ChocoRepo SMB 445"
        display_name: "ChocoRepo SMB 445"
        localport: 445
        protocol: tcp
        direction: in
        action: allow
        state: present
        enabled: yes

# ======================
# PLAY 2 — NODES (lab)
# ======================
- name: Instalar pacotes nos nodes a partir do share do controller (com usuário/senha)
  hosts: laboratorio9003
  gather_facts: no
  collections:
    - ansible.windows

  vars:
    controller_smb_host: "192.168.0.139"          # AJUSTE para IP/nome do controller
    share_name:          "ChocoRepo"
    choco_source_name:   "choco_repo"
    local_export:        "C:\\Windows\\Temp\\choco_export"
    # Mesmas credenciais criadas no controller:
    smb_user: 'repo_user'
    smb_pass: 'TroqueEstaSenha!2025'

  tasks:
    - name: Definir caminhos UNC
      set_fact:
        choco_unc:  "\\\\{{ controller_smb_host }}\\{{ share_name }}"
        unc_export: "\\\\{{ controller_smb_host }}\\{{ share_name }}\\export"
        unc_nupkg:  "\\\\{{ controller_smb_host }}\\{{ share_name }}\\nupkg"

    # --- FORÇAR SHELL CMD (só para estas tasks) ---
    - name: Fechar sessões SMB antigas com o controller
      win_shell: 'net use \\{{ controller_smb_host }} /delete /y'
      args:
        executable: cmd
      changed_when: false
      failed_when: false

    # Tente com SERVER\user (melhor para conta local do controller)
    - name: Abrir sessão SMB com usuário/senha (SERVER\user)
      win_shell: >
        net use \\{{ controller_smb_host }}\IPC$ {{ smb_pass }} /user:{{ controller_netbios | default(controller_smb_host) }}\{{ smb_user }} /persistent:no
      args:
        executable: cmd
      register: netuse_try1
      changed_when: false
      failed_when: false

    # Fallback: tente só com user (alguns ambientes aceitam)
    - name: Abrir sessão SMB com usuário/senha (user simples) se a 1ª falhar
      win_shell: >
        net use \\{{ controller_smb_host }}\IPC$ {{ smb_pass }} /user:{{ smb_user }} /persistent:no
      args:
        executable: cmd
      when: netuse_try1.rc != 0
      register: netuse_try2
      changed_when: false
      failed_when: false

    # Validar que pelo menos uma conectou
    - name: Validar sessão SMB estabelecida
      ansible.builtin.assert:
        that:
          - (netuse_try1 is defined and netuse_try1.rc == 0) or (netuse_try2 is defined and netuse_try2.rc == 0)
        fail_msg: >
          Não foi possível abrir sessão SMB em \\{{ controller_smb_host }}. Verifique usuário/senha e se o share aceita esse login.

    # (Opcional) Listar o share para garantir acesso
    - name: Testar acesso ao share
      win_shell: 'dir \\{{ controller_smb_host }}\{{ share_name }}'
      args:
        executable: cmd
      changed_when: false


    # 1) Testar o UNC antes
    - win_command: cmd.exe /c dir {{ unc_nupkg }}
      changed_when: false

    # 2) (Opcional) desabilitar a fonte pública para evitar acesso externo
    - win_chocolatey_source:
        name: chocolatey
        state: disabled

    # 3) Só então criar/ajustar a fonte SMB
    - win_chocolatey_source:
        name: "{{ choco_source_name }}"
        state: present
        source: "{{ unc_nupkg }}"
        priority: 1
        bypass_proxy: yes

    - name: Copiar manifesto do controller -> local
      win_shell: >
        powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
        "Copy-Item -Path '{{ unc_export }}\packages_with_params.json' -Destination '{{ local_export }}\packages_with_params.json' -Force -ErrorAction Stop"
      register: copy_manifest
      changed_when: true
      failed_when: copy_manifest.rc not in [0]

    - name: Ler JSON do manifesto (local)
      win_shell: >
        powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
        "Get-Content -Path '{{ local_export }}\packages_with_params.json' -Raw"
      register: manifest_json
      changed_when: false
      failed_when: manifest_json.rc not in [0]

    - name: Parse do manifesto
      set_fact:
        pkgs_from_manifest: "{{ manifest_json.stdout | from_json }}"

    # 3) Fonte do Chocolatey e instalação
    - name: Garantir fonte Chocolatey -> SMB (nupkg)
      win_chocolatey_source:
        name: "{{ choco_source_name }}"
        state: present
        source: "{{ unc_nupkg }}"
        priority: 1
        bypass_proxy: yes

    - name: Instalar pacotes (via install_args)
      win_chocolatey:
        name: "{{ item.name }}"
        state: present
        source: "{{ choco_source_name }}"
        install_args: "{{ (item.args | regex_replace('.*--install-arguments\\s+','')) | trim }}"
      loop: "{{ pkgs_from_manifest }}"
      when: item.kind == 'passthrough'
      loop_control:
        label: "{{ item.name }} (install_args)"

    - name: Instalar pacotes (via params)
      win_chocolatey:
        name: "{{ item.name }}"
        state: present
        source: "{{ choco_source_name }}"
        params: "{{ (item.args | trim | length > 0) | ternary(item.args, omit) }}"
      loop: "{{ pkgs_from_manifest }}"
      when: item.kind != 'passthrough'
      loop_control:
        label: "{{ item.name }} (params)"
