---
- name: Verificar conectividade e limpar hosts falhados no inventory.ini
  hosts: all  # Pode ser 'localhost' ou qualquer grupo de hosts, como 'windows'
  gather_facts: no
  tasks:
    - name: Realizar ping para verificar conectividade
      win_ping:
      register: ping_results
      ignore_errors: yes  # Permite que a execução continue mesmo que o ping falhe

    - name: Coletar hosts falhados
      set_fact:
        failed_hosts: "{{ groups['all'] | selectattr('ping_results.failed', 'eq', true) | map('extract', 'host') | list }}"
      when: ping_results is defined

    - name: Limpar os hosts falhados do grupo "failed" no inventory.ini
      ini_file:
        path: "/caminho/para/inventory.ini"  # Caminho para o seu arquivo de inventário
        section: "failed"
        option: "{{ item }}"
        state: absent
      loop: "{{ failed_hosts }}"
      when: failed_hosts | length > 0  # Só executa se houver hosts falhados

