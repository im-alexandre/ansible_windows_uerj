# tasks/conda_configure.yml
# Instala miniforge3 (Chocolatey), configura conda (libmamba, channels),
# fixa Python 3.12 no base, instala Jupyter Notebook/Lab e principais libs do Anaconda,
# define envs_dirs/pkgs_dirs, auto_activate_base e diretório padrão do Jupyter.
# Aplica ACLs completas no conda_root.

# -------------------------------------------------------------------
# 0) Instalar miniforge3 via Chocolatey (garantir um único root)
# -------------------------------------------------------------------
- name: Garantir miniforge3 instalado via Chocolatey
  win_chocolatey:
    name: miniforge3
    state: present

# Caminho do wrapper .bat (confiável no Windows)
- set_fact:
    conda_bat: "{{ conda_root }}\\condabin\\conda.bat"

# -------------------------------------------------------------------
# 1) Diretórios de envs e cache (envs_dirs e pkgs_dirs)
# -------------------------------------------------------------------
- name: Garantir diretórios de envs e pkgs
  win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ conda_envs }}"
    - "{{ conda_pkgs }}"

# -------------------------------------------------------------------
# 2) Configuração do Conda (.condarc via conda config)
# -------------------------------------------------------------------
- name: Definir canal conda-forge e prioridade strict
  win_shell: |
    {{ conda_bat }} config --remove-key channels -q || cmd /c exit 0
    {{ conda_bat }} config --add channels conda-forge -q
    {{ conda_bat }} config --set channel_priority strict
  args:
    executable: cmd

- name: Aplicar envs_dirs e pkgs_dirs
  win_shell: |
    {{ conda_bat }} config --remove-key envs_dirs -q || cmd /c exit 0
    {{ conda_bat }} config --add envs_dirs "{{ conda_envs }}" -q
    {{ conda_bat }} config --remove-key pkgs_dirs -q || cmd /c exit 0
    {{ conda_bat }} config --add pkgs_dirs "{{ conda_pkgs }}" -q
  args:
    executable: cmd

- name: Definir solver libmamba e auto_activate_base
  win_shell: |
    {{ conda_bat }} config --set solver libmamba
    {{ conda_bat }} config --set auto_activate_base true
  args:
    executable: cmd

# Pacotes padrão ao criar ambientes (úteis para você)
- name: Configurar create_default_packages
  win_shell: |
    for %p in (jedi-language-server lsprotocol pynvim pip ipykernel ipywidgets) do {{ conda_bat }} config --add create_default_packages %p
  args:
    executable: cmd

# -------------------------------------------------------------------
# 3) Base: Python 3.12 + Jupyter + principais libs do Anaconda
# -------------------------------------------------------------------
# Observação: usar o .bat evita o "conda-script.py" e garante PATH correto.
# Lista de libs "clássicas" do Anaconda + seu set (ajuste à vontade).
- set_fact:
    base_libs: >-
      python=3.12
      jupyterlab
      notebook
      jupyterlab_widgets
      ipywidgets
      ipykernel
      numpy
      pandas
      scipy
      matplotlib
      seaborn
      scikit-learn
      scikit-image
      statsmodels
      sympy
      numba
      networkx
      pillow
      requests
      lxml
      sqlalchemy
      openpyxl
      xlrd
      pyarrow

- name: Instalar/atualizar base com principais bibliotecas
  win_shell: |
    {{ conda_bat }} install -n base -y {{ base_libs }}
  args:
    executable: cmd
  register: base_install

# (Opcional) limpeza de cache para evitar sobras/breaks
- name: Limpar caches de pacotes (conda clean)
  win_shell: |
    {{ conda_bat }} clean -a -y
  args:
    executable: cmd
  when: base_install is changed

# -------------------------------------------------------------------
# 4) conda init (PowerShell) para hook e auto-activate
# -------------------------------------------------------------------
- name: Inicializar conda no PowerShell (hook no $PROFILE)
  win_shell: |
    {{ conda_bat }} init powershell
  args:
    executable: cmd

# -------------------------------------------------------------------
# 5) Testes rápidos
# -------------------------------------------------------------------
- name: Verificar Python 3.12 (base)
  win_shell: '{{ conda_bat }} run -n base python -V'
  register: py_ver
  changed_when: false
  args:
    executable: cmd

- name: Verificar JupyterLab
  win_shell: '{{ conda_bat }} run -n base jupyter-lab --version'
  register: jl_ver
  changed_when: false
  args:
    executable: cmd

- debug:
    msg:
      - "✅ miniforge3 em: {{ conda_root }}"
      - "✅ Python base: {{ py_ver.stdout | trim }}"
      - "✅ JupyterLab: {{ jl_ver.stdout | trim }}"

# -------------------------------------------------------------------
# 6) Jupyter: diretório padrão e config
# -------------------------------------------------------------------
- name: Garantir diretório padrão dos notebooks
  win_file:
    path: "D:\\notebooks"
    state: directory

- name: Criar diretório de configuração do Jupyter (se não existir)
  win_file:
    path: "C:\\Users\\{{ ansible_user }}\\.jupyter"
    state: directory

# Compatível com JupyterLab/Notebook recentes (ServerApp)
- name: Aplicar jupyter_notebook_config.py
  win_copy:
    dest: "C:\\Users\\{{ ansible_user }}\\.jupyter\\jupyter_notebook_config.py"
    content: |
      c.ServerApp.root_dir = r'D:\\notebooks'
      c.ServerApp.ip = '0.0.0.0'
      c.ServerApp.port = 8888
      c.ServerApp.open_browser = False

# -------------------------------------------------------------------
# 7) Garantir permissões (ACL) no conda_root
# -------------------------------------------------------------------
- name: Garantir ACL no diretório raiz do Conda
  win_acl:
    path: "{{ conda_root }}"
    user: "{{ ansible_user }}"
    rights: FullControl
    type: allow
    inheritance: ContainerInherit, ObjectInherit
    state: present

- name: Listar subdiretórios imediatos do Conda
  win_find:
    paths: "{{ conda_root }}"
    file_type: directory
    recurse: no
  register: conda_dirs

- name: Montar lista de caminhos a aplicar ACL
  set_fact:
    acl_targets: "{{ [conda_root] + (conda_dirs.files | map(attribute='path') | list) }}"

- name: Aplicar ACLs em paralelo (FullControl)
  win_acl:
    path: "{{ item }}"
    user: "{{ ansible_user }}"
    rights: FullControl
    type: allow
    inheritance: ContainerInherit, ObjectInherit
    state: present
  loop: "{{ acl_targets }}"
  async: 1800
  poll: 0
  register: acl_jobs

- name: Aguardar conclusão das ACLs
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: acl_wait
  until: acl_wait.finished
  retries: 300
  delay: 3
  loop: "{{ acl_jobs.results }}"

- name: Validar resultado das ACLs
  assert:
    that:
      - item.finished
      - item.rc is not defined or item.rc == 0
    fail_msg: "Falha ao aplicar ACL em {{ item.results.path | default('caminho desconhecido') }}"
  loop: "{{ acl_wait.results }}"
