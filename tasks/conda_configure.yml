---
- name: Instalar o mamba
  win_shell: |
    & "{{ conda_exe }}" install -y -n base -c conda-forge mamba
  register: install_mamba
  changed_when: "'[y/N]' in install_mamba.stdout or 'Proceed' in install_mamba.stdout"


- name: Criar diretórios otimizados para cache e envs
  win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ conda_root }}"
    - "{{ conda_envs }}"
    - "{{ conda_pkgs }}"

- name: Criar o arquivo .condarc no home do usuário
  win_copy:
    content: "{{ condarc_content }}"
    dest: "{{ condarc_dest }}"


- name: Testar instalação do Mamba
  win_shell: |
    & "{{ conda_exe }}" run -n base mamba --version
  args:
    executable: powershell
  register: mamba_version
  changed_when: false

- debug:
    msg: "✅ Mamba instalado com sucesso: {{ mamba_version.stdout }}"

- name: Criar alias 'conda install' → 'mamba install'
  win_shell: |
    Add-Content "$env:USERPROFILE\Documents\WindowsPowerShell\profile.ps1" `
    "Set-Alias conda-install 'mamba install'";

    Add-Content "$env:USERPROFILE\Documents\PowerShell\Microsoft.PowerShell_profile.ps1" `
    "Set-Alias conda-install 'mamba install'"
  args:
    executable: powershell
  ignore_errors: yes

- name: Instalar bibliotecas módulos
  win_shell: |
    & "{{ conda_exe }}" install jedi-language-server "pygls<2.0" lsprotocol pynvim "platformdirs==4.2.2"
