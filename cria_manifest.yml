---
- name: (Controller) Gerar manifestos e garantir share
  hosts: controller_win
  gather_facts: no
  vars:
    repo_root:   'C:\choco_repo'
    repo_nupkg:  'C:\choco_repo\nupkg'
    repo_export: 'C:\choco_repo\export'
    share_name:  'ChocoRepo'

  tasks:
    - name: Garantir pastas do repositório
      ansible.windows.win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ repo_root }}"
        - "{{ repo_nupkg }}"
        - "{{ repo_export }}"

    - name: Ler packages.txt
      delegate_to: local
      slurp:
        src: "files/packages.txt"
      register: pkgs_file

    # 1) Defina _pkgs_text
    - name: Normalizar conteúdo
      set_fact:
        _pkgs_text: >-
          {{ pkgs_file.content | b64decode
             | regex_replace('^\uFEFF','')
             | regex_replace('^\u00EF\u00BB\u00BF','')
             | regex_replace('^"|"$','')
             | regex_replace('\\\\r','')
             | regex_replace('\\\\n','\n') }}

    # 2) Agora gere _lines (pode usar _pkgs_text aqui)
    - name: Quebrar em linhas úteis
      set_fact:
        _lines: >-
          {{ _pkgs_text.splitlines()
             | map('trim')
             | reject('equalto','')
             | reject('match','^#')
             | list }}

    # 3) Construir lista de objetos [{name, kind, args}]
    - name: Inicializar lista de pacotes para o JSON
      set_fact:
        pkgs_list: []

    - name: Popular pkgs_list com name/kind/args
      set_fact:
        pkgs_list: "{{ pkgs_list + [ {
          'name': name_only,
          'kind': kind,
          'args': rest
        } ] }}"
      vars:
        name_only: "{{ (item.split(' ', 1))[0] }}"
        rest:      "{{ ((item.split(' ', 1) | length) > 1) | ternary((item.split(' ',1))[1], '') }}"
        kind:      "{{ (rest is search('--install-arguments')) | ternary('passthrough','params') }}"
      loop: "{{ _lines }}"
      loop_control:
        label: "{{ item }}"

    # 4) Escrever JSON no export
    - name: Salvar packages_with_params.json
      ansible.windows.win_copy:
        dest: "{{ repo_export }}\\packages_with_params.json"
        content: "{{ pkgs_list | to_nice_json }}"

    - name: Criar/atualizar compartilhamento SMB (pt-BR) sem prompt
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference='Stop'; $ConfirmPreference='None'
          $ShareName='{{ share_name }}'; $Path='{{ repo_root }}'
          $Read='Todos'; $Change='AUTORIDADE NT\Usuários autenticados'
          New-Item -Path $Path -ItemType Directory -Force | Out-Null
          if (-not (Get-SmbShare -Name $ShareName -ErrorAction SilentlyContinue)) {
            New-SmbShare -Name $ShareName -Path $Path -CachingMode None -ReadAccess $Read -ChangeAccess $Change -Confirm:$false | Out-Null
          } else {
            Revoke-SmbShareAccess -Name $ShareName -AccountName $Read   -Force -Confirm:$false -ErrorAction SilentlyContinue
            Revoke-SmbShareAccess -Name $ShareName -AccountName $Change -Force -Confirm:$false -ErrorAction SilentlyContinue
            Grant-SmbShareAccess  -Name $ShareName -AccountName $Read   -AccessRight Read   -Force -Confirm:$false | Out-Null
            Grant-SmbShareAccess  -Name $ShareName -AccountName $Change -AccessRight Change -Force -Confirm:$false | Out-Null
            Set-SmbShare -Name $ShareName -CachingMode None -Confirm:$false | Out-Null
          }

